model_name: "bert-base-cased"
subtoken_pooling: "first"
fine_tune: True
hidden_size: 768

dataset_path: "CoNLL 2003"

max_width: 15
span_mode: "endpoints"

dropout: 0.4
sample_rate: 0.6
model_type: "fsemicrf"
decoding: "global"

# Keep #3 disabled for clean ablation
soft_filter: False
null_confidence_threshold: 0.9
uncertain_top_k: 8

# Relaxed thresholds for better recall (Improvement #1)
type_confidence_thresholds:
  PERSON: 0.65
  ORG: 0.55
  LOC: 0.60
  MISC: 0.55

# Relaxed span length constraints (Improvement #2)
type_length_ranges:
  PERSON: [1, 6]
  ORG: [1, 12]
  LOC: [1, 5]
  MISC: [1, 7]

learning_rates:
  - 1e-5
  - 1e-4

weight_decay:
  - 1e-3
  - 1e-2

batch_size:
  - 16
  - 32

training:
  - epoch: 1
    steps: 1000
    warmup_ratio: 0.001
    eval_steps: 250

root_dir: "logs"
