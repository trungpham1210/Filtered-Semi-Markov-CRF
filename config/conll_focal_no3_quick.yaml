model_name: "bert-base-cased"
subtoken_pooling: "first"
fine_tune: True
hidden_size: 768

dataset_path: "CoNLL 2003"

max_width: 15
span_mode: "endpoints"

dropout: 0.4
sample_rate: 0.6
model_type: "fsemicrf"
decoding: "global"

# Keep #3 disabled for a clean comparison
soft_filter: False
null_confidence_threshold: 0.9
uncertain_top_k: 8

# New idea: focal modulation on local span classification loss
# Helps focus on hard examples and reduce easy-negative dominance
focal_gamma_entity: 1.0
focal_gamma_non_entity: 2.0

learning_rates:
  - 1e-5
  - 1e-4

weight_decay:
  - 1e-3
  - 1e-2

batch_size:
  - 16
  - 32

training:
  - epoch: 1
    steps: 1000
    warmup_ratio: 0.001
    eval_steps: 250

root_dir: "logs"
